package=co.com.ficohsa
systemProp.version=3.27.0
reactive=true
lombok=true
metrics=true
language=java

# Gradle Performance Settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Configuration Cache (puede causar problemas con algunos plugins de IDE)
# Descomenta estas líneas si no tienes problemas con tu IDE
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.parallel=true
# org.gradle.configuration-cache.integrity-check=true

# IDE Compatibility
org.gradle.console=plain
systemProp.sonar.gradle.skipCompile=true
